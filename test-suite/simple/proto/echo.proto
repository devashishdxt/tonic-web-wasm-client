syntax = "proto3";

package echo;

service Echo {
  rpc Echo (EchoRequest) returns (EchoResponse) {}

  rpc EchoStream (EchoRequest) returns (stream EchoResponse) {}

  rpc EchoInfiniteStream (EchoRequest) returns (stream EchoResponse) {}

  rpc EchoErrorResponse (EchoRequest) returns (EchoResponse) {}

  rpc EchoTimeout (EchoRequest) returns (EchoResponse) {}

  rpc EchoStreamError (EchoRequest) returns (stream EchoResponse) {}

  // Answers with the values of the request metadata key named in the message.
  rpc EchoMetadata (EchoRequest) returns (EchoResponse) {}
}

message EchoRequest {
    string message = 1;
}

message EchoResponse {
    string message = 1;
}
